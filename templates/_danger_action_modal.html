<div id="dangerActionModal" class="danger-modal" hidden role="dialog" aria-modal="true" aria-labelledby="dangerActionTitle" aria-describedby="dangerActionMessage">
    <div class="danger-modal-panel" tabindex="-1">
        <h3 id="dangerActionTitle">{{ 'Confirm action'|lang }}</h3>
        <p id="dangerActionMessage"></p>
        <p class="danger-modal-hint">{{ 'Please confirm to continue.'|lang }}</p>
        <div class="button-row">
            <button type="button" class="btn btn-secondary" data-danger-cancel>{{ 'Cancel'|lang }}</button>
            <button type="button" class="btn" data-danger-confirm>{{ 'Confirm'|lang }}</button>
        </div>
    </div>
</div>
