{% extends "base.html" %}

{% block content %}


    <div style="max-width: 400px; margin: 50px auto;">
        <div class="card">
            <h1>{{ 'Change Password'|lang }}</h1>
            
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <label>{{ 'New Password'|lang }}
                <input type="password" autocomplete="new-password" name="new_password" required autofocus></label>
                
                <label>{{ 'Confirm New Password'|lang }}
                <input type="password" autocomplete="new-password" name="confirm_password" required></label>
                
                <button type="submit" class="btn" style="width: 100%;">{{ 'Change Password'|lang }}</button>
            </form>
            
            <p style="text-align: center; margin-top: 20px;">
                <a href="{{ url_for('proposals') }}" style="color: #00d9ff;">← {{ 'Proposals'|lang }}</a>
            </p>
        </div>
    </div>
{% endblock %}
