{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 80px auto;">
    <div class="card">
        <h1 style="text-align: center;">🔧 MakeSpace Madrid</h1>
        <p style="text-align: center; color: #888; margin-bottom: 30px;">{{ 'Budget'|lang }} {{ 'Proposals'|lang }}</p>

        {% if oidc_enabled %}
        <a href="{{ url_for('auth.keycloak_login') }}" class="btn" style="display: flex; width: 100%; box-sizing: border-box; text-align: center; margin-bottom: 24px;" aria-label="Sign in with MakeSpace SSO">
            <span aria-hidden="true">🔐</span>
            <span>Sign in with MakeSpace SSO</span>
        </a>
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px; color: #888;">
            <span style="height: 1px; background: #555; flex: 1;"></span><span>or</span><span style="height: 1px; background: #555; flex: 1;"></span>
        </div>
        {% endif %}
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>{{ 'Username'|lang }}</label>
            <input type="text" name="username" required autofocus>
            
            <label>{{ 'Password'|lang }}</label>
            <input type="password" name="password" required>
            
            <button type="submit" class="btn" style="width: 100%;">{{ 'Login'|lang }}</button>
        </form>

        <p style="text-align: center; margin-top: 20px; color: #888;">
            {{ 'No account yet'|lang }} <a href="{{ url_for('register') }}" style="color: #00d9ff;">{{ 'Register'|lang }}</a>
        </p>

        <div style="text-align: center; margin-top: 15px;">
        <a href="{{ url_for('auth.set_language', lang='en') }}" style="color: #888; font-size: 0.85em;">{{ 'English'|lang }}</a> |
        <a href="{{ url_for('auth.set_language', lang='es') }}" style="color: #888; font-size: 0.85em;">{{ 'Español'|lang }}</a>
        </div>
    </div>
</div>
{% endblock %}
