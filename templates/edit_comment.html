{% extends "base.html" %}

{% block content %}


<div class="card">
    <h1>{{ 'Edit Comment'|lang }}</h1>
    
    <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"
        <label>{{ 'Comments'|lang }}
        <textarea name="content" required style="min-height: 100px;">{{ comment.content }}</textarea></label>
        
        <button type="submit" class="btn">{{ 'Save'|lang }}</button>
    </form>
</div>
{% endblock %}
